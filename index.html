 * Dashboard Kas Sekolah V3 - Google Apps Script
 * Paste di Extensions > Apps Script dari spreadsheet:
 * https://docs.google.com/spreadsheets/d/1bJBxKUZdrl7sh3jL0kd1Va8igbesUo6CXFjlvP88L_A/edit

const SHEETS = {
  siswa: "Rincian_Siswa",
  masuk: "Riwayat_Masuk",
  keluar: "Kas_Keluar",
  ringkasan: "Ringkasan"
};

function ensureSheets() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let created = false;
  Object.values(SHEETS).forEach(name => {
    if (!ss.getSheetByName(name)) {
      ss.insertSheet(name);
      created = true;
    }
  });
  // init headers if empty
  const siswaSheet = ss.getSheetByName(SHEETS.siswa);
  if (siswaSheet.getLastRow() === 0) {
    siswaSheet.getRange(1,1,1,5).setValues([["id","nis","nama","gender","kelas"]]);
  }
  const masukSheet = ss.getSheetByName(SHEETS.masuk);
  if (masukSheet.getLastRow() === 0) {
    masukSheet.getRange(1,1,1,6).setValues([["id","siswaId","nominal","tanggal","tipe","keterangan"]]);
  }
  const keluarSheet = ss.getSheetByName(SHEETS.keluar);
  if (keluarSheet.getLastRow() === 0) {
    keluarSheet.getRange(1,1,1,5).setValues([["id","nominal","keperluan","tanggal","oleh"]]);
  }
  const ringkSheet = ss.getSheetByName(SHEETS.ringkasan);
  if (ringkSheet.getLastRow() === 0) {
    ringkSheet.getRange(1,1,4,2).setValues([["Total Masuk",0],["Total Keluar",0],["Saldo",0],["Last Sync", new Date()]]);
  }
  return ss;
}

function doGet(e) {
  try {
    const ss = ensureSheets();
    const siswaSheet = ss.getSheetByName(SHEETS.siswa);
    const masukSheet = ss.getSheetByName(SHEETS.masuk);
    const keluarSheet = ss.getSheetByName(SHEETS.keluar);
    const ringkSheet = ss.getSheetByName(SHEETS.ringkasan);

    // Read siswa
    const siswaData = siswaSheet.getDataRange().getValues();
    const siswa = [];
    for (let i=1;i<siswaData.length;i++) {
      const r = siswaData[i];
      if (!r[0]) continue;
      siswa.push({ id: r[0], nis: r[1], nama: r[2], gender: r[3], kelas: r[4] });
    }
    // Read masuk
    const masukData = masukSheet.getDataRange().getValues();
    const transaksi = [];
    for (let i=1;i<masukData.length;i++) {
      const r = masukData[i];
      if (!r[0]) continue;
      transaksi.push({ id: r[0], siswaId: r[1], nominal: Number(r[2]), tanggal: r[3], tipe: r[4], keterangan: r[5] });
    }
    // Read keluar
    const keluarData = keluarSheet.getDataRange().getValues();
    const kasKeluar = [];
    for (let i=1;i<keluarData.length;i++) {
      const r = keluarData[i];
      if (!r[0]) continue;
      kasKeluar.push({ id: r[0], nominal: Number(r[1]), keperluan: r[2], tanggal: r[3], oleh: r[4] });
    }

    const totalMasuk = transaksi.reduce((s,t)=>s+Number(t.nominal||0),0);
    const totalKeluar = kasKeluar.reduce((s,k)=>s+Number(k.nominal||0),0);

    const payload = {
      siswa,
      transaksi,
      kasKeluar,
      ringkasan: { totalMasuk, totalKeluar, saldo: totalMasuk-totalKeluar, lastSync: new Date().toISOString() }
    };

    return ContentService.createTextOutput(JSON.stringify(payload))
      .setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({ error: String(err) }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    const ss = ensureSheets();
    let data;
    // Apps Script sometimes sends as text/plain
    if (e.postData && e.postData.contents) {
      data = JSON.parse(e.postData.contents);
    } else if (e.parameter && e.parameter.payload) {
      data = JSON.parse(e.parameter.payload);
    } else {
      throw new Error("No payload");
    }

    if (data.action === "syncAll") {
      // Siswa
      const siswaSheet = ss.getSheetByName(SHEETS.siswa);
      siswaSheet.clearContents();
      const siswaRows = [["id","nis","nama","gender","kelas"]];
      (data.siswa || []).forEach(s => {
        siswaRows.push([s.id, s.nis, s.nama, s.gender, s.kelas]);
      });
      siswaSheet.getRange(1,1,siswaRows.length,5).setValues(siswaRows);

      // Masuk
      const masukSheet = ss.getSheetByName(SHEETS.masuk);
      masukSheet.clearContents();
      const masukRows = [["id","siswaId","nominal","tanggal","tipe","keterangan"]];
      (data.transaksi || []).forEach(t => {
        masukRows.push([t.id, t.siswaId, t.nominal, t.tanggal, t.tipe, t.keterangan]);
      });
      masukSheet.getRange(1,1,masukRows.length,6).setValues(masukRows);

      // Keluar
      const keluarSheet = ss.getSheetByName(SHEETS.keluar);
      keluarSheet.clearContents();
      const keluarRows = [["id","nominal","keperluan","tanggal","oleh"]];
      (data.kasKeluar || []).forEach(k => {
        keluarRows.push([k.id, k.nominal, k.keperluan, k.tanggal, k.oleh]);
      });
      keluarSheet.getRange(1,1,keluarRows.length,5).setValues(keluarRows);

      // Ringkasan
      const ringkSheet = ss.getSheetByName(SHEETS.ringkasan);
      ringkSheet.clearContents();
      const totalMasuk = (data.ringkasan && data.ringkasan.totalMasuk) || 0;
      const totalKeluar = (data.ringkasan && data.ringkasan.sumKeluar) || (data.ringkasan && data.ringkasan.totalKeluar) || 0;
      const saldo = (data.ringkasan && data.ringkasan.saldo) || (totalMasuk-totalKeluar);
      ringkSheet.getRange(1,1,5,2).setValues([
        ["Total Masuk", totalMasuk],
        ["Total Keluar", totalKeluar],
        ["Saldo", saldo],
        ["Jumlah Siswa", (data.siswa||[]).length],
        ["Last Sync", new Date()]
      ]);

      const res = { success: true, message: "Synced", rows: { siswa: siswaRows.length-1, transaksi: masukRows.length-1, kasKeluar: keluarRows.length-1 } };
      return ContentService.createTextOutput(JSON.stringify(res)).setMimeType(ContentService.MimeType.JSON);
    }

    return ContentService.createTextOutput(JSON.stringify({ error: "Unknown action" })).setMimeType(ContentService.MimeType.JSON);
  } catch(err) {
    return ContentService.createTextOutput(JSON.stringify({ error: String(err), stack: err.stack }))
      .setMimeType(ContentService.MimeType.JSON);
